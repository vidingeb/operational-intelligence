swagger: '2.0'
info:
  title: vCenter Local API
  version: 1.4.0
  description: MAP vCenter Connector for Copilot Studio via on-premises data gateway
host: localhost:8080
basePath: /
schemes:
  - http
consumes: []
produces:
  - application/json
paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
  /hosts:
    get:
      summary: List ESXi hosts
      operationId: listHosts
      responses:
        '200':
          description: OK
  /hosts/usage:
    get:
      summary: Show ESXi host resource usage
      operationId: listHostUsage
      responses:
        '200':
          description: OK
  /vms:
    get:
      summary: List virtual machines
      operationId: listVMs
      responses:
        '200':
          description: OK
  /folders:
    get:
      summary: Authoritative inventory folder list and search
      operationId: listFolders
      description: >
        Includes system folders. Every folder record includes its managed-object
        id, name, and canonical escaped inventory path for topology selectors.
      parameters:
        - in: query
          name: name
          type: string
          description: Case-insensitive folder name filter
        - in: query
          name: exact
          type: boolean
          default: false
          description: Exact rather than contains name matching
      responses:
        '200':
          description: Folder records and explicit search completeness
  /folders/topology:
    get:
      summary: Authoritative read-only topology of one inventory folder
      operationId: getFolderTopology
      description: >
        Supply exactly one nonempty folder_id, path, or name. Names match exactly
        and case-insensitively; ambiguous names return 409 with candidate IDs and
        full paths. Paths match exactly, including case and percent escaping:
        each inventory segment is URL-escaped (a slash in a name is %2F).
        The path query value must also be encoded normally by the HTTP client.
        Unknown selectors return 404 only after a complete folder scan.
        Folder enumeration or identity failures return an explicit error, not absence.
        Membership comes from folder.childEntity and, recursively, vApp VM and
        nested-vApp references. recursive=false includes only immediate VMs.
        All discovered VMs are examined without pagination or truncation.
        Hosts come only from vm.runtime.host, storage from vm.datastore, and
        network references from each VirtualEthernetCard backing.
        Distributed backings resolve by both switch UUID and portgroup key,
        never by names. Unresolved backings retain actual backing keys and errors.
        Opaque IDs and types remain opaque; the name is the actual opaque ID
        label, path is null, and no NSX inference is made.
        There is no host-network, traffic, firewall, or metrics inference.
        Partial object or relationship failures return 200 with complete=false
        and explicit errors. Unnamed/unreadable VM identities are omitted and
        counts still account for examination. A null relationship plus an error
        means unreadable/unresolved, not assumed absence or disconnection.
      parameters:
        - in: query
          name: folder_id
          type: string
          description: Exact managed-object ID from GET /folders
        - in: query
          name: path
          type: string
          description: Exact root-qualified escaped inventory path from GET /folders
        - in: query
          name: name
          type: string
          description: Exact case-insensitive name; refuses ambiguous matches
        - in: query
          name: recursive
          type: boolean
          default: true
          description: Include descendant folders and vApps; always explicit in response
      responses:
        '200':
          description: Complete or explicitly partial topology; inspect complete and errors
          schema:
            $ref: '#/definitions/FolderTopology'
        '400':
          description: Exactly one nonempty selector is required
        '404':
          description: Complete scan found no folder; detail.complete is true
        '409':
          description: >
            Ambiguous selector; detail contains complete=true and candidates,
            each with id, name, and full canonical path.
        '422':
          description: Invalid query parameter type (including recursive)
        '502':
          description: >
            vCenter or folder enumeration/identity failure. Inventory failures
            include detail.complete=false and detail.errors; no absence claim.
        '503':
          description: vCenter credentials are not configured
  /vms/search:
    get:
      summary: Search virtual machines
      operationId: searchVMs
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Search string for VM name
      responses:
        '200':
          description: OK
  /vms/poweredoff:
    get:
      summary: List powered off virtual machines
      operationId: listPoweredOffVMs
      responses:
        '200':
          description: OK
  /vm/details:
    get:
      summary: Get detailed information for a virtual machine
      operationId: getVMDetails
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/storage:
    get:
      summary: Show datastores used by a virtual machine
      operationId: getVMStorage
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/snapshots:
    get:
      summary: Show snapshots for a virtual machine
      operationId: getVMSnapshots
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /snapshots/old:
    get:
      summary: List old snapshots
      operationId: listOldSnapshots
      parameters:
        - in: query
          name: days
          type: integer
          default: 14
          required: false
          description: Snapshot age in days
      responses:
        '200':
          description: OK
  /datastores:
    get:
      summary: List datastores
      operationId: listDatastores
      responses:
        '200':
          description: OK
  /datastores/lowfree:
    get:
      summary: List datastores with low free space
      operationId: listDatastoresLowFree
      parameters:
        - in: query
          name: threshold_percent
          type: integer
          default: 20
          required: false
          description: Free space threshold percentage
      responses:
        '200':
          description: OK
  /clusters:
    get:
      summary: List clusters
      operationId: listClusters
      responses:
        '200':
          description: OK
  /clusters/summary:
    get:
      summary: Show vSphere cluster summary
      operationId: listClusterSummary
      responses:
        '200':
          description: OK
  /alarms:
    get:
      summary: List active alarms
      operationId: listActiveAlarms
      responses:
        '200':
          description: OK
  /tasks/recent:
    get:
      summary: Show recent vCenter tasks
      operationId: listRecentTasks
      parameters:
        - in: query
          name: limit
          type: integer
          default: 20
          required: false
          description: Number of recent tasks to return
      responses:
        '200':
          description: OK
  /events/recent:
    get:
      summary: Show recent vCenter events
      operationId: listRecentEvents
      parameters:
        - in: query
          name: limit
          type: integer
          default: 20
          required: false
          description: Number of recent events to return
      responses:
        '200':
          description: OK
  /vmtools/outdated:
    get:
      summary: List VMs with outdated VMware Tools
      operationId: listOutdatedVMwareTools
      responses:
        '200':
          description: OK
  /vmtools/notrunning:
    get:
      summary: List VMs where VMware Tools is not running
      operationId: listVMwareToolsNotRunning
      responses:
        '200':
          description: OK
  /vm/poweron:
    post:
      summary: Power on a virtual machine
      operationId: powerOnVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/poweroff:
    post:
      summary: Hard power off a virtual machine
      operationId: powerOffVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/shutdown_guest:
    post:
      summary: Gracefully shut down guest OS
      operationId: shutdownGuestVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/reboot_guest:
    post:
      summary: Reboot guest OS
      operationId: rebootGuestVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/reset:
    post:
      summary: Reset a virtual machine
      operationId: resetVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/suspend:
    post:
      summary: Suspend a virtual machine
      operationId: suspendVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/snapshot/create:
    post:
      summary: Create VM snapshot
      operationId: createVMSnapshot
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
        - in: query
          name: snapshot_name
          type: string
          required: true
          description: Snapshot name
        - in: query
          name: description
          type: string
          required: false
          description: Snapshot description
        - in: query
          name: memory
          type: boolean
          required: false
          default: false
          description: Include VM memory
        - in: query
          name: quiesce
          type: boolean
          required: false
          default: false
          description: Quiesce guest filesystem
      responses:
        '200':
          description: OK
  /vm/snapshot/remove_all:
    post:
      summary: Remove all snapshots from VM
      operationId: removeAllVMSnapshots
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
      responses:
        '200':
          description: OK
  /vm/vmotion:
    post:
      summary: vMotion VM to another host
      operationId: vMotionVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
        - in: query
          name: target_host
          type: string
          required: true
          description: Target ESXi host name
      responses:
        '200':
          description: OK
  /vm/storage_vmotion:
    post:
      summary: Storage vMotion VM to another datastore
      operationId: storageVMotionVM
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact VM name
        - in: query
          name: target_datastore
          type: string
          required: true
          description: Target datastore name
      responses:
        '200':
          description: OK
  /host/maintenance/enter:
    post:
      summary: Put ESXi host into maintenance mode
      operationId: enterHostMaintenance
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
      responses:
        '200':
          description: OK
  /host/maintenance/exit:
    post:
      summary: Exit ESXi host from maintenance mode
      operationId: exitHostMaintenance
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
      responses:
        '200':
          description: OK
  /host/reboot:
    post:
      summary: Reboot ESXi host
      operationId: rebootHost
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
        - in: query
          name: force
          type: boolean
          required: false
          default: false
          description: Force reboot
      responses:
        '200':
          description: OK
  /host/shutdown:
    post:
      summary: Shutdown ESXi host
      operationId: shutdownHost
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
        - in: query
          name: force
          type: boolean
          required: false
          default: false
          description: Force shutdown
      responses:
        '200':
          description: OK
  /host/disconnect:
    post:
      summary: Disconnect ESXi host from vCenter
      operationId: disconnectHost
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
      responses:
        '200':
          description: OK
  /host/reconnect:
    post:
      summary: Reconnect ESXi host to vCenter
      operationId: reconnectHost
      parameters:
        - in: query
          name: name
          type: string
          required: true
          description: Exact ESXi host name
      responses:
        '200':
          description: OK
definitions:
  InventoryReference:
    type: object
    required: [id, name, path]
    properties:
      id:
        type: string
        description: Actual managed-object ID (not a name-based key)
      name:
        type: string
        description: Actual inventory name
      path:
        type: string
        description: Root-qualified inventory path with individually escaped segments; includes the named inventory root
  TopologyNetwork:
    type: object
    required: [id, name, path, kind]
    properties:
      id:
        type: string
        description: Managed-object ID, or actual opaqueNetworkId for opaque backings
      name:
        type: string
        description: Actual network name, or actual opaque ID label for opaque backings
      path:
        type: string
        x-nullable: true
        description: Canonical path; null for opaque ID/type-only backings
      kind:
        type: string
        enum: [standard, distributed, opaque]
      switch_uuid:
        type: string
        description: Distributed backing switchUuid, when kind is distributed
      portgroup_key:
        type: string
        description: Distributed backing portgroupKey, when kind is distributed
      opaque_network_type:
        type: string
        description: Actual opaqueNetworkType, when kind is opaque; no inferred technology
  TopologyNIC:
    type: object
    required: [key, label, network, backing]
    properties:
      key:
        type: integer
        description: Actual device key; NICs with unreadable identity are omitted with an explicit error
      label:
        type: string
        description: Actual deviceInfo.label; never an invented label
      network:
        x-nullable: true
        $ref: '#/definitions/TopologyNetwork'
      backing:
        type: object
        additionalProperties: true
        description: >
          Actual backing properties serialized recursively, with type naming the
          pyVmomi backing class. Managed-object references serialize as {id}.
          An explicitly absent backing is {type: null}; a failed backing read
          is {} with a corresponding error. Unresolved distributed backings
          keep port.switchUuid, port.portgroupKey and other actual properties.
  TopologyVM:
    allOf:
      - $ref: '#/definitions/InventoryReference'
      - type: object
        required: [host, datastores, nics]
        properties:
          host:
            x-nullable: true
            $ref: '#/definitions/InventoryReference'
          datastores:
            type: array
            description: Actual vm.datastore references, deduplicated and sorted by ID
            items:
              $ref: '#/definitions/InventoryReference'
          nics:
            type: array
            description: VirtualEthernetCard devices sorted by actual device key
            items:
              $ref: '#/definitions/TopologyNIC'
  TopologyError:
    type: object
    required: [object_id, relationship, error]
    properties:
      object_id:
        type: string
        x-nullable: true
        description: Actual managed-object ID; null for inventory/view-level failures
      relationship:
        type: string
        description: Failed property or relationship, with device key for NIC backing errors
      error:
        type: string
        description: Exception type and message
  FolderTopology:
    type: object
    required:
      - schema_version
      - source
      - collected_at
      - folder
      - recursive
      - complete
      - errors
      - counts
      - truncated
      - vms
    properties:
      schema_version:
        type: string
        enum: [folder-topology-v1]
      source:
        type: string
        enum: [vcenter]
      collected_at:
        type: string
        format: date-time
        description: UTC collection timestamp (not an atomic inventory snapshot)
      folder:
        $ref: '#/definitions/InventoryReference'
      recursive:
        type: boolean
      complete:
        type: boolean
        description: False if any membership, identity, relationship or cleanup read failed
      errors:
        type: array
        items:
          $ref: '#/definitions/TopologyError'
      counts:
        type: object
        required: [enumerated, examined, returned]
        properties:
          enumerated:
            type: integer
            description: Unique VM IDs discovered; not a total for unreadable subtrees
          examined:
            type: integer
            description: Discovered VMs examined, including unreadable identities
          returned:
            type: integer
            description: Exactly the length of vms, including partial relationship records
      truncated:
        type: boolean
        enum: [false]
        description: Always false; errors are not truncation
      vms:
        type: array
        description: VM identity records sorted by canonical path and ID; deduplicated by ID
        items:
          $ref: '#/definitions/TopologyVM'
parameters: {}
responses: {}
security: []
tags: []
securityDefinitions: {}
