# NVIDIA AI Workbench compose file for the on-prem AI orchestrator.
# Docs: https://docs.docker.com/reference/compose-file/
#
# PURPOSE
# A lab rig for learning the NVIDIA stack — Workbench profiles, GPU
# reservations, and serving a model the "NVIDIA way" with NIM — WITHOUT
# disturbing the production assistant.
#
# WHERE THIS RUNS
# On the DGX Spark (GB10), not on a Mac: NIM is CUDA/Linux-only and Docker
# Desktop has no GPU passthrough.
#
# WHAT IS ALREADY RUNNING (do not fight it)
#   * The Spark runs Ollama natively via systemd, holding gpt-oss:120b
#     resident (~60.7 GB of ~121 GB usable) with OLLAMA_KEEP_ALIVE=-1.
#   * The production assistant runs on a SEPARATE host (photon-machine) as
#     the systemd units orchestrator.service / orchestrator-ui.service, and
#     reaches this Spark's Ollama over Tailscale.
#
# So by default this file starts NO second Ollama — the containers use the
# host's. A second one would collide on port 11434 and re-pull ~60 GB that
# is already on disk. The native Ollama already accepts connections from
# containers; no `systemctl edit` is needed.
#
# ---------------------------------------------------------------------
# !! PORT CLASH WARNING !!
# The production assistant also uses 8090/8091. If you run this stack on a
# host where those services are active, override the ports:
#     ORCHESTRATOR_PORT=18090 WEB_UI_PORT=18091 docker compose up -d
# Two orchestrators reading the same Ollama is fine; two UIs on one port
# is not.
# ---------------------------------------------------------------------
#
# PROFILES
#   (none)      -> orchestrator + web-ui against the HOST Ollama  [safe default]
#   nim         -> NVIDIA NIM microservice (OpenAI-compatible)
#   own-ollama  -> a containerised Ollama, ONLY for a host with none
#   ui          -> Open WebUI, a second front-end for comparing models
#   bench       -> one-shot GPU/driver sanity check
#
#     docker compose --profile nim up -d
#
# Prefer `./scripts/spark-nim up` for the nim profile: it refuses to start
# when there is not enough memory free beside the resident assistant model.
#
# MEMORY BUDGET (GB10 = 128 GB unified, ~121 GB usable, shared CPU+GPU)
#   gpt-oss:120b resident    ~60.7 GB
#   NIM Llama 3.1 8B           ~18 GB  + KV cache
#   NIM Qwen3-32B              ~19 GB cache footprint
# An 8B NIM fits alongside the 120B. For the 32B, free the big model first —
# the Unpin button in the assistant UI, or `spark-nim up`, which does it.
#
# WHICH MODEL TO PICK (this hardware punishes the obvious choice)
# Bandwidth (~273 GB/s), not capacity, sets decode speed: roughly
# tok/s ~= bandwidth / bytes-read-per-token. So a DENSE 70B at FP8 reads
# ~70 GB per token and lands at ~3 tok/s — it fits, and it is useless for
# chat. Community DGX Spark numbers:
#   dense 70B FP8   ~3 tok/s      <- fits, unusable interactively
#   dense 32B       ~57 tok/s
#   MoE 30B-class   ~72 tok/s
#   gpt-oss:120b    ~39 tok/s     <- MoE, only ~5B active per token
# That is why the resident 120B feels fast despite its size. Prefer MoE or
# <=32B dense; treat dense 70B as a benchmark curiosity, not a daily driver.
# NVIDIA does not list any 70B as GB10-verified in the NIM support matrix.
#
# There is no MIG on GB10, so the GPU is time-sliced: concurrent inference
# makes both sides slower. That is expected, not a misconfiguration.
#
# UMA GOTCHA: NVIDIA warns that allocations can fail even when capacity
# looks fine, because the buffer cache holds unified memory. If NIM fails
# to allocate with the 120B evicted and free memory looking ample:
#   sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'

x-host-ollama: &host-ollama
  # Reach the native Ollama running on the Spark host itself.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:

  orchestrator:
    <<: *host-ollama
    build: ./orchestrator
    # uvicorn shuts down cleanly on SIGINT; on SIGTERM it waits to be killed.
    stop_signal: SIGINT
    environment:
      # Setting NVWB_TRIM_PREFIX routes the service through the Workbench
      # proxy; `true` strips the prefix before forwarding. Workbench injects
      # PROXY_PREFIX into the container in return.
      - NVWB_TRIM_PREFIX=true

      # Defaults to the HOST's native Ollama, not a compose service.
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Reuse the model already resident on the Spark — no extra memory cost.
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-oss:120b}
      # Which model Pin/Unpin acts on. Empty falls back to DEFAULT_MODEL.
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-}
      # A 120B answering a tool-heavy question can run for minutes.
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-900}

      - MCP_SERVER=${MCP_SERVER:-}
      - GB10_TELEMETRY_URL=${GB10_TELEMETRY_URL:-}
      - HISTORY_TURNS=${HISTORY_TURNS:-6}

      # Persist outside the image so `compose down` does not discard
      # conversations, schedules and stored reports.
      - STATE_DB=/data/state.db

      # Deliberately conservative for a lab stack: no writes to vCenter or
      # Veeam, and no scheduler firing questions on a timer. A second
      # scheduler running against production credentials is not a surprise
      # anyone wants. Opt in explicitly.
      - ENABLE_WRITE_TOOLS=${ENABLE_WRITE_TOOLS:-false}
      - WRITE_REQUIRE_CONFIRM=${WRITE_REQUIRE_CONFIRM:-true}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
    ports:
      - "${ORCHESTRATOR_PORT:-8090}:8090"
    volumes:
      - orchestrator-state:/data
      # Workbench mounts this in every container in the project.
      - /nvwb-shared-volume:/nvwb-shared-volume
    healthcheck:
      # The image is python:slim — no curl, so use the interpreter.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8090/health',timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web-ui:
    build: ./orchestrator
    command: ["python3", "web_ui.py"]
    stop_signal: SIGINT
    depends_on:
      orchestrator:
        # Wait for readiness, not merely for the container to exist, so the
        # first page load does not race the API.
        condition: service_healthy
    environment:
      - NVWB_TRIM_PREFIX=true
      - ORCHESTRATOR_URL=http://orchestrator:8090
    ports:
      - "${WEB_UI_PORT:-8091}:8091"
    volumes:
      - /nvwb-shared-volume:/nvwb-shared-volume

  # ---------------------------------------------------------------
  # profile: nim — the "NVIDIA way" of serving a model.
  # Needs NGC_API_KEY (Environment > Project Container > Secrets) and
  # `docker login nvcr.io` on the Spark.
  #
  # ARM64 NOTE: not every NIM has an arm64 build. LLM NIMs generally have
  # DGX Spark variants; many vision/speech ones are x86_64-only. Confirm
  # the tag exists on NGC before pulling — a wrong guess costs a multi-GB
  # download — and pin NIM_TAG rather than trusting `latest`.
  #
  # NIM_MAX_MODEL_LEN caps KV cache growth, which is what actually blows
  # the memory budget under load; the weights are the predictable part.
  # ---------------------------------------------------------------
  # Docker only inherits ownership for a named volume when the image already
  # has content at the mount path. The NIM image ships NO /opt/nim/.cache and
  # no /opt/nim/workspace, so Docker creates both mountpoints root:root 0755
  # while the image runs as uid 1000 (`nvs`). NIM then dies partway through
  # the weight download with:
  #
  #   ManifestDownloadError: Error downloading manifest:
  #   I/O error Permission denied (os error 13)
  #
  # This runs first, as root, and hands the volumes to uid 1000. It reuses the
  # NIM image itself so there is no second image to pull and no chance of an
  # arch mismatch. Idempotent, so it is safe on every `up`.
  #
  # It also WIPES the workspace, which is derived state, not data. NIM fills
  # /opt/nim/workspace with symlinks into the cache and points vLLM at it. The
  # links are model-specific, so reusing the volume across models leaves the
  # previous model's layout in place and the next one fails on whichever file
  # differs between them, e.g. switching llama-3.1-8b -> qwen3-32b:
  #
  #   ManifestDownloadError: file: file not found: added_tokens.json
  #
  # (Llama has no added_tokens.json; Qwen does.) That error names a download,
  # so it reads like a broken NGC repo, but the weights are present and intact
  # in the cache. Only the workspace is stale. The cache is deliberately NOT
  # wiped: it holds the expensive downloads and is keyed by model already.
  nim-init:
    profiles: ["nim"]
    image: nvcr.io/nim/${NIM_ORG:-meta}/${NIM_MODEL:-llama-3.1-8b-instruct-dgx-spark}:${NIM_TAG:-latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /opt/nim/.cache /opt/nim/workspace && rm -rf /opt/nim/workspace/* /opt/nim/workspace/.[!.]* 2>/dev/null; chown -R 1000:1000 /opt/nim/.cache /opt/nim/workspace"]
    volumes:
      - nim-cache:/opt/nim/.cache
      - nim-workspace:/opt/nim/workspace
    restart: "no"

  nim:
    profiles: ["nim"]
    depends_on:
      nim-init:
        condition: service_completed_successfully
    # NOTE THE `-dgx-spark` SUFFIX. It is not optional.
    # Standard NIM images (e.g. .../llama-3.1-8b-instruct:latest) publish no
    # arm64 manifest and die with "exec format error" on GB10. Worse, some
    # images that DO list GB10 in the support matrix still crash while
    # compiling Triton kernels ("'sm_121' is not a recognized processor")
    # after downloading tens of GB. The -dgx-spark variants exist precisely
    # to avoid that: they ship a vLLM build with SM121 support.
    #
    # Confirmed -dgx-spark images (2026-08):
    #   meta/llama-3.1-8b-instruct-dgx-spark   <- NVIDIA's own entry point
    #   qwen/qwen3-32b-dgx-spark               <- 32B, the "bigger than 8B" pick
    # Avoid nvidia-nemotron-nano-9b-v2-dgx-spark: NGC still lists it under
    # nvstaging, and it has open permission-error reports.
    image: nvcr.io/nim/${NIM_ORG:-meta}/${NIM_MODEL:-llama-3.1-8b-instruct-dgx-spark}:${NIM_TAG:-latest}
    environment:
      # NOTE: deliberately NOT ${NGC_API_KEY:?...}. Compose interpolates the
      # whole file before filtering by profile, so a required-variable guard
      # here breaks `docker compose up` for the DEFAULT profile too, on a
      # service that was never going to start. scripts/spark-nim checks the
      # key before launching instead.
      - NGC_API_KEY=${NGC_API_KEY:-}
      # Bare names, not NAME=${NAME:-}. The latter passes an EMPTY STRING when
      # unset, and NIM does int(os.getenv("NIM_MAX_MODEL_LEN", 8192)) — whose
      # default only covers an ABSENT variable, so int('') crashes the
      # container on startup. The bare form omits the variable entirely.
      - NIM_MAX_MODEL_LEN
      - NIM_MODEL_PROFILE
      # Fraction of the WHOLE unified pool vLLM reserves at startup, default
      # 0.5 (~61 GiB of 121 GiB) whatever the model size. On a discrete GPU
      # that would be VRAM; on GB10 it is contending with Ollama and the OS.
      # Set 0.25 to run an 8B NIM alongside the pinned 120B; leave unset to
      # let NIM take half the box (and evict the 120B first).
      - NIM_GPU_MEM_FRACTION
      - NIM_RELAX_MEM_CONSTRAINTS
    ports:
      - "${NIM_PORT:-8000}:8000"
    volumes:
      # Cache the weights, or every recreate re-downloads them (8-20 GB for
      # the 8B, ~19 GB for the 32B).
      - nim-cache:/opt/nim/.cache
      - nim-workspace:/opt/nim/workspace
    # NIM uses shared memory for tensor traffic; the 64 MB default is too
    # small and surfaces as an obscure crash rather than a clear error.
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      # First start builds an engine profile for the GPU, which is slow.
      retries: 60
      start_period: 180s

  # ---------------------------------------------------------------
  # profile: own-ollama — ONLY for a host with no native Ollama.
  # Leave this off on the Spark; it will fight the systemd service.
  # The default host port is 11435, not 11434, to avoid the clash.
  # ---------------------------------------------------------------
  ollama:
    profiles: ["own-ollama"]
    image: docker.io/ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ollama-models:/root/.ollama
      - /nvwb-shared-volume:/nvwb-shared-volume
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Pulls models into the containerised Ollama, then exits.
  model-pull:
    profiles: ["own-ollama"]
    image: docker.io/ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      # $$m escapes the $ so Compose passes it to the shell instead of
      # interpolating it away.
      - |
        set -e
        for m in ${OLLAMA_MODELS:-llama3.1:8b qwen2.5:7b}; do
          echo "==> pulling $$m"
          ollama pull "$$m"
        done
        echo "==> done"
    restart: "no"

  # ---------------------------------------------------------------
  # profile: ui — Open WebUI, handy for comparing models side by side
  # ---------------------------------------------------------------
  open-webui:
    profiles: ["ui"]
    image: ghcr.io/open-webui/open-webui:main
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NVWB_TRIM_PREFIX=false
      - OLLAMA_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      # Auth off is convenient on a private tailnet and wrong anywhere else.
      - WEBUI_AUTH=${WEBUI_AUTH:-False}
    ports:
      - "${OPEN_WEBUI_PORT:-8080}:8080"
    volumes:
      - open-webui:/app/backend/data

  # ---------------------------------------------------------------
  # profile: bench — verify driver/CUDA visibility inside compose.
  # Reserving by device_ids (rather than count) is what lets services
  # share a GPU explicitly.
  #
  # On GB10 the memory columns read [N/A]: unified memory is not a
  # discrete VRAM pool. Use /proc/meminfo instead — which is what
  # scripts/spark-nim and gb10-telemetry/telemetry.py do.
  # ---------------------------------------------------------------
  gpu-check:
    profiles: ["bench"]
    image: docker.io/nvidia/cuda:12.6.2-base-ubuntu24.04
    command: ["nvidia-smi"]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]

volumes:
  orchestrator-state:
  ollama-models:
  nim-cache:
  # Named volumes rather than host bind mounts, so nothing depends on the host
  # user's uid matching the container's. They are NOT seeded from the image
  # though — the NIM image has no /opt/nim/.cache — so the nim-init service
  # above chowns them to uid 1000 before NIM starts.
  nim-workspace:
  open-webui:
